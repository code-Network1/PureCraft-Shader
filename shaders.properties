#PureCraft Shader
#Modified and Updated for PureCraft Edition
#
# PureCraft Shader - Performance-optimized visual enhancement for Minecraft.
# Preserves vanilla gameplay while boosting FPS with subtle improvements: natural
# white clouds, brighter nights, enhanced lighting. Pure vanilla feel with better
# performance for all hardware.
#

#Profiles
profile.PERFORMANCE=!SHADOW !ADVANCED_MATERIALS !LIGHT_SHAFT shadowMapResolution=512 shadowDistance=128.0 !TAA
profile.QUALITY=SHADOW ADVANCED_MATERIALS LIGHT_SHAFT shadowMapResolution=2048 shadowDistance=256.0 TAA
profile.ULTRA=profile.QUALITY shadowMapResolution=4096 shadowDistance=512.0

#Force Video Settings
dynamicHandLight=true
oldHandLight=false
oldLighting=false
underwaterOverlay=false
vignette=false

#Screen Setup
screen = [PureCraft] [Sky] [Effects] [Lighting] [Material] [Color]

screen.PureCraft = SHARPENING CAS_AMOUNT MC_RENDER_QUALITY
screen.Sky = CUSTOM_SKY DYNAMIC_CLOUDS CLOUD_LAYERS CLOUD_SPEED CLOUD_DENSITY RAIN_CLOUDS CLOUDS CLOUD_BASE CLOUD_HEIGHT CLOUD_SCALE
screen.Effects = LIGHT_SHAFT BLOOM MOTION_BLUR DOF LENS_FLARE UNDERWATER_DISTORTION
screen.Lighting = SHADOW shadowMapResolution shadowDistance SHADOW_FILTER AO MULTICOLORED_BLOCKLIGHT
screen.Material = ADVANCED_MATERIALS REFLECTION PARALLAX EMISSIVE WATER_MODE
screen.Color = LIGHT_COLOR BLOCKLIGHT_COLOR ATMOSPHERE_COLOR WATER_COLOR

sliders=CAS_AMOUNT CLOUD_SPEED CLOUD_DENSITY CLOUD_LAYERS shadowMapResolution shadowDistance

uniform.float.framemod8 = frameCounter % 8
